name: Voorraadsync Odoo <-> Shopify

# Gratis, serverloze sync via een geplande taak.
# LET OP: geplande (cron) workflows draaien alleen vanaf de DEFAULT branch (main).
# Merge deze workflow dus naar main voordat de planning actief wordt.
on:
  schedule:
    # Vangnet: start de lus opnieuw als de keten ooit onderbroken is.
    # De repo is publiek, dus Actions-minuten zijn onbeperkt. Wordt de repo
    # privé, dan past deze lus NIET in de gratis 2000 min/maand.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # knop om handmatig te draaien (Actions-tab > Run workflow)

concurrency:
  group: stock-sync
  cancel-in-progress: false # nooit twee runs tegelijk (vermijdt dubbele boekingen)

permissions:
  contents: read
  actions: write # nodig om de volgende lus te starten

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: odoo-shopify-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Sync draaien (lus, elke paar minuten)
        # GitHub voert de cron in de praktijk maar om de paar uur uit.
        # Daarom draait één run zelf een lus: elke SYNC_INTERVAL_MIN minuten
        # (standaard 5) een volledige sync, ongeveer 5u30 lang. Daarna start
        # de run zichzelf opnieuw (stap hieronder). De cron blijft als vangnet.
        # Stoppen: zet repo-variabele SYNC_LOOP op 'off', of annuleer de run.
        shell: bash
        run: |
          interval=$(( ${SYNC_INTERVAL_MIN:-5} * 60 ))
          if [ "${SYNC_LOOP}" = "off" ]; then budget=0; else budget=$(( 330 * 60 )); fi
          end=$(( SECONDS + budget ))
          while true; do
            node src/sync-once.js || echo "::warning::sync-run mislukt, volgende poging over ${interval}s"
            [ $(( SECONDS + interval )) -ge $end ] && break
            sleep "$interval"
          done
        env:
          # --- Niet-geheime config (identifiers, geen wachtwoorden) ---
          ODOO_URL: https://ateliermarhaban.odoo.com
          ODOO_DB: ateliermarhaban
          ODOO_LOCATION_NAME: WH/Voorraad
          SHOPIFY_SHOP: a67ee0-af.myshopify.com
          SHOPIFY_API_VERSION: '2026-10'
          SHOPIFY_LOCATION_ID: '98409709893'
          # --- Geheimen: vul je in onder Settings > Secrets > Actions ---
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          # Nieuwe Dev Dashboard-app: token wordt per run opgehaald via client_credentials.
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Zet DRY_RUN op 'true' (repo variable) om eerst alleen te loggen.
          DRY_RUN: ${{ vars.DRY_RUN }}
          SYNC_INTERVAL_MIN: ${{ vars.SYNC_INTERVAL_MIN }}
          SYNC_LOOP: ${{ vars.SYNC_LOOP }}
          # Zet SYNC_CUSTOMERS op 'false' (repo variable) om klant-/adressync uit te zetten.
          SYNC_CUSTOMERS: ${{ vars.SYNC_CUSTOMERS }}
          SYNC_INVOICES: ${{ vars.SYNC_INVOICES }}
      - name: Volgende lus starten
        # workflow_dispatch met GITHUB_TOKEN start wel degelijk een nieuwe run.
        # Door de concurrency-groep staat die in de wachtrij tot deze run klaar is.
        if: ${{ !cancelled() && vars.SYNC_LOOP != 'off' }}
        working-directory: .
        run: gh workflow run stock-sync.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
