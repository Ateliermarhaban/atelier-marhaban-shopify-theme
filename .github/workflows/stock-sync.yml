name: Voorraadsync Odoo <-> Shopify

# Gratis, serverloze sync via een geplande taak.
# LET OP: geplande (cron) workflows draaien alleen vanaf de DEFAULT branch (main).
# Merge deze workflow dus naar main voordat de planning actief wordt.
on:
  schedule:
    # Elke 30 minuten. Pas aan naar wens; let op je gratis Actions-minuten
    # bij een private repo (2000 min/maand). '*/15 * * * *' = elke 15 min.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # knop om handmatig te draaien (Actions-tab > Run workflow)

concurrency:
  group: stock-sync
  cancel-in-progress: false # nooit twee runs tegelijk (vermijdt dubbele boekingen)

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odoo-shopify-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Sync draaien
        run: node src/sync-once.js
        env:
          # --- Niet-geheime config (identifiers, geen wachtwoorden) ---
          ODOO_URL: https://ateliermarhaban.odoo.com
          ODOO_DB: ateliermarhaban
          ODOO_LOCATION_NAME: WH/Stock
          SHOPIFY_SHOP: a67ee0-af.myshopify.com
          SHOPIFY_API_VERSION: '2026-10'
          SHOPIFY_LOCATION_ID: '98409709893'
          # --- Geheimen: vul je in onder Settings > Secrets > Actions ---
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          # Nieuwe Dev Dashboard-app: token wordt per run opgehaald via client_credentials.
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # Zet DRY_RUN op 'true' (repo variable) om eerst alleen te loggen.
          DRY_RUN: ${{ vars.DRY_RUN }}
