name: Spiegelrapport Odoo <-> Shopify

# Alleen lezen: vergelijkt SKU, prijs en voorraad tussen Odoo en Shopify.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'odoo-shopify-connector/scripts/mirror-report.js'
      - '.github/workflows/mirror-report.yml'

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odoo-shopify-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --omit=dev
      - name: Rapport
        run: node scripts/mirror-report.js
        env:
          ODOO_URL: https://ateliermarhaban.odoo.com
          ODOO_DB: ateliermarhaban
          ODOO_LOCATION_NAME: WH/Stock
          SHOPIFY_SHOP: a67ee0-af.myshopify.com
          SHOPIFY_API_VERSION: '2026-10'
          SHOPIFY_LOCATION_ID: '98409709893'
          ODOO_USERNAME: ${{ secrets.ODOO_USERNAME }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DRY_RUN: 'true'
